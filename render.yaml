services:
  - type: web
    name: paradise-ag-api
    runtime: node
    region: oregon
    plan: free
    rootDirectory: paradise_ag_backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_HOST
        fromDatabase:
          name: paradise-ag-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: paradise-ag-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: paradise-ag-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: paradise-ag-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: paradise-ag-db
          property: database
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://paradise-ag.netlify.app
      - key: SUPABASE_URL
        value: https://dbmbkevspcozcnhcsyii.supabase.co
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRibWJrZXZzcGNvemNuaGNzeWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3ODczNTUsImV4cCI6MjA5OTM2MzM1NX0.7W2hZ0QIBYdpZ4tYh_wl7M3SpP9NzD7QWO90QHk5FDo

databases:
  - name: paradise-ag-db
    region: oregon
    plan: free
    databaseName: paradise_ag
    ipAllowList: []
