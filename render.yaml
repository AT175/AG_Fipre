        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: paradise-ag-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: paradise-ag-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: paradise-ag-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: paradise-ag-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: paradise-ag-db
          property: password
      - key: DB_DATABASE
